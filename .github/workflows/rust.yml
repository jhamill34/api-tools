name: Rust Build
on:
  pull_request:
  push:
    branches: [ "main" ]
    tags: ["v*.*.*"]
    
env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test
    runs-on: macos-latest
    steps: 
      - name: Checkout 
        uses: actions/checkout@v3
      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install Protoc
        uses: arduino/setup-protoc@v2
        with:
          repo-token: ${{ github.token }}
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format Check
        run: cargo fmt --all -- --check

      - name: Clippy Check
        run: cargo clippy

      - name: Testing
        run: cargo test

      - name: Smoke test apid startup
        run: |
          set -e

          smoke_dir="${RUNNER_TEMP}/apid-smoke"
          mkdir -p "${smoke_dir}/connectors"

          cat > "${smoke_dir}/config.toml" <<EOF
          [connector]
          path = "${smoke_dir}/connectors"

          [log]
          api_path = "${smoke_dir}/api.log"
          workflow_path = "${smoke_dir}/workflow.log"

          [server]
          port = 50098
          host = "127.0.0.1"
          EOF

          cargo build -p apid

          APID_CONFIG_PATH="${smoke_dir}/config.toml" HOME="${smoke_dir}" \
            ./target/debug/apid > "${smoke_dir}/apid.log" 2>&1 &
          apid_pid=$!

          started=0
          for _ in $(seq 1 20); do
            if ! kill -0 "${apid_pid}" 2>/dev/null; then
              echo "apid exited before it started listening:"
              cat "${smoke_dir}/apid.log"
              exit 1
            fi
            if nc -z 127.0.0.1 50098 2>/dev/null; then
              started=1
              break
            fi
            sleep 0.5
          done

          kill "${apid_pid}" 2>/dev/null || true
          wait "${apid_pid}" 2>/dev/null || true

          if [ "${started}" -ne 1 ]; then
            echo "apid never started listening on its configured port:"
            cat "${smoke_dir}/apid.log"
            exit 1
          fi

          echo "apid started and bound its gRPC port successfully"

  build-apid-image:
    name: build-apid-image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build apid image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./binary/apid/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-apicli:
    name: deploy-apicli
    runs-on: ${{ matrix.os }}
    needs: [test]
    if: startsWith(github.ref, 'refs/tags/')
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-
            ${{ runner.os }}-cargo-

      - name: Install Protoc
        uses: arduino/setup-protoc@v2
        with:
          repo-token: ${{ github.token }}
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build CLI
        run: cargo build --release --target ${{ matrix.target }} -p apicli

      - name: Package
        shell: bash
        run: |
          ./package.sh ${{ github.ref_name }} ${{ matrix.target }}

      - name: Publish
        uses: softprops/action-gh-release@v1
        # TODO: if any of the build step fails, the release should be deleted.
        with:
            files: 'dist/apicli*'

  deploy-apid:
    name: deploy-apid
    runs-on: ubuntu-latest
    needs: [test]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push apid image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./binary/apid/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/apid:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/apid:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

