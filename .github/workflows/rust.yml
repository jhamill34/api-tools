name: Rust Build
on:
  pull_request:
  push:
    branches: [ "main" ]
    tags: ["v*.*.*"]
    
env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test
    runs-on: macos-latest
    steps: 
      - name: Checkout 
        uses: actions/checkout@v3
      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install Protoc
        uses: arduino/setup-protoc@v2
        with:
          repo-token: ${{ github.token }}
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format Check
        run: cargo fmt --all -- --check

      - name: Clippy Check
        run: cargo clippy

      - name: Testing
        run: cargo test
  
  build-apid-image:
    name: build-apid-image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build apid image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./binary/apid/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-apicli:
    name: deploy-apicli
    runs-on: ${{ matrix.os }}
    needs: [test]
    if: startsWith(github.ref, 'refs/tags/')
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-
            ${{ runner.os }}-cargo-

      - name: Install Protoc
        uses: arduino/setup-protoc@v2
        with:
          repo-token: ${{ github.token }}
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build CLI
        run: cargo build --release --target ${{ matrix.target }} -p apicli

      - name: Package
        shell: bash
        run: |
          ./package.sh ${{ github.ref_name }} ${{ matrix.target }}

      - name: Publish
        uses: softprops/action-gh-release@v1
        # TODO: if any of the build step fails, the release should be deleted.
        with:
            files: 'dist/apicli*'

  deploy-apid:
    name: deploy-apid
    runs-on: ubuntu-latest
    needs: [test]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push apid image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./binary/apid/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/apid:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/apid:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

