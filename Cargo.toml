[profile.release]
debug = true

[workspace]
resolver = "2"
members = [
	# Main Binary (crates outside of binary should be libraries)
	"binary/apid",
	"binary/apicli",

	# Data types that we will be passing around
	"entities/credentials",
	"entities/core",
	"entities/engine",
	
	# Implementations of application logic
	"usecases/service_loader",
	"usecases/execution_engine",
	"usecases/service_writer", 

	# Implementations of execution_engine output port
	"runners/api_caller",
	"runners/python_runner",
	"runners/javascript_runner",
	"runners/lua_runner",
	"runners/user_input",
	"runners/filtered_runner",

	# Implementations of service_loader output ports
	"storage/in_memory_storage",
	"storage/local_file_loader",

	"common/data_structures",

	"auth/oauth_flow",

	# Spikes / prototypes - not wired into any binary yet, see the linked
	# issue in each crate's README for context and status.
	"prototypes/workflow_engine",
]

[workspace.dependencies]
anyhow = "1.0"
base64 = "0.21.0"
chrono = "0.4.24"
dhat = "0.3.2"
dotenv = "0.15"
jmespath = "0.3"
jsonptr = "0.4.2"
lazy_static = "1.4"
mlua = { version = "0.9", features = ["lua54", "vendored", "serialize"] }
prost = "0.11"
protobuf = "3.2"
protobuf-codegen = "3.2"
protobuf-json-mapping = "3.2"
regex = "1.7"
reqwest = "0.11.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "1.0"
tokio = { version = "1", features = ["full"] }
toml = "0.7"
tonic = "0.9"
tonic-build = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
